version: 1
record_type: pms_plan
required_fields:
  plan_id: "PMS-PLAN-<product>-<yyyy-mm>"
  product_id: ""
  review_frequency: "monthly|quarterly|other_with_rationale"
  data_sources:
    - complaints
    - incidents
    - support_tickets
    - reliability_metrics
  signal_thresholds:
    - metric: ""
      threshold: ""
      escalation_path: ""
  linked_records:
    risk_reference: ""
    complaint_log_reference: ""
    incident_log_reference: ""
    pmcf_plan_reference: ""          # records/clinical/pmcf_plan.md (SOP-025 §6.12); MDR Annex III Section 1(b)
    pmcf_not_applicable_justification: ""  # only if no PMCF plan: residual uncertainties, why PMS data suffice, why class/novelty/evidence make that acceptable (SOP-025 §6.12(6)); QA Lead + MR approval
    clinical_evaluation_report_reference: ""
  clinical_feedback_loop:
    cer_update_triggers:
      - "significant safety signal"
      - "PMCF result affecting safety, performance, or benefit-risk"
      - "state-of-the-art change affecting CER benchmarks"
  ai_performance_monitoring:       # only when the product contains AI/ML components
    applicable: false
    metrics:
      - metric: ""
        threshold: ""
        escalation_path: ""
    input_drift_detection: ""
    subgroup_performance_monitoring: ""
    human_oversight_indicators: ""   # e.g. override and disagreement rates
