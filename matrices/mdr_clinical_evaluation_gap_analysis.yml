version: 1
analysis_date: "2026-11-19"
regulation:
  exact_name: "Regulation (EU) 2017/745 on medical devices (MDR): clinical evaluation and post-market clinical follow-up"
  normative_base: "MDR Art. 61 and Annex XIV (consolidated text)"
  normative_source_verified: true
analysis_scope: >
  Clinical evaluation and PMCF of medical device software placed on the EU market
  under Regulation (EU) 2017/745, and in Switzerland under MedDO (SR 812.213)
  Art. 21(4) and Art. 46(3), which require the same clinical evaluation by
  reference to MDR Art. 61 and Annex XIV. In vitro diagnostic
  performance evaluation under Regulation (EU) 2017/746 is out of scope.
analysis_provenance:
  retrieved_on: "2026-11-19"
  sources:
    - "Regulation (EU) 2017/745, consolidated text 2026-11-09: http://data.europa.eu/eli/reg/2017/745/2026-11-09 (articles and Annex II 6.1 checked)"
    - "Regulation (EU) 2017/745, consolidated text 2025-01-10, PDF: https://eur-lex.europa.eu/legal-content/EN/TXT/PDF/?uri=CELEX:02017R0745-20250110 (Annexes III, VIII and XIV checked; none amended by acts after that date)"
    - "MDCG endorsed documents list: https://health.ec.europa.eu/medical-devices-sector/new-regulations/guidance-mdcg-endorsed-documents-and-other-guidance_en"
    - "MedDO (SR 812.213), Fedlex English text: https://www.fedlex.admin.ch/eli/cc/2020/552/en (Art. 21 para. 4 and Art. 46 para. 3 checked 2026-11-20)"
    - "ISO project 85514, ISO/FDIS 18969 (stage 50.00, final text registered for formal approval; checked on iso.org 2026-11-20; not yet published)"
  notes:
    - "Art. 61(6)(b) (exemptions from clinical investigation) was replaced by Commission Delegated Regulation (EU) 2026/1451. SOP-025 refers to Art. 61(6) only generically; adopters relying on the exemption must read the current list."
    - "Legal requirements are cited from the regulation text. Guidance is cited by document number and revision as listed by the Commission on the retrieval date."
    - "The BSI white paper 'Clinical Evaluation of Software as a Medical Device (SaMD) for Conformity Assessment' (2026) was read as informative background on common notified-body findings. It is copyrighted; no text, tables, or figures from it are reproduced in this matrix, SOP-025, or records/clinical/."
outstanding_gaps:
  - "ISO 18969 (clinical evaluation of medical devices) is at FDIS stage (50.00); review SOP-025 against the published edition once available and decide whether to add it to qms_intent_standards."
  - "MDR Art. 61(4) to (6) are covered at decision level (SOP-025 §6.8(5), §6.9(5); CEP section 8) but have no dedicated exemption template, and Art. 61(2) expert panel consultation is only referenced; the baseline targets software, for which class III is uncommon. Adopters with class III or implantable devices add a template using MDCG 2023-7 and the current Art. 61(6)(b) list."
  - "Clinical investigation conduct (MDR Art. 62-82, Annex XV, ISO 14155:2020) is referenced, not proceduralised; adopters running investigations need a study-level procedure or a CRO's controlled procedures under SOP-010."
