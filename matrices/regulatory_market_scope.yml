version: 1
scope_owner_role: management_representative
last_reviewed_on: "2026-03-01"
jurisdictions:
  - jurisdiction: Switzerland
    device_framework:
      name: "Ordinance on Medical Devices (MedDO)"
      citation: "SR 812.213"
      key_references:
        - ref: "Art. 3 MedDO"
          note: "Medical device definition baseline in Switzerland."
        - ref: "Art. 15 MedDO"
          note: "Classification refers to Annex VIII EU MDR, including software classification approach."
      source_links:
        - "https://www.swissmedic.ch/swissmedic/en/home/medical-devices/regulation-of-medical-devices/faq.html"
        - "https://www.swissmedic.ch/dam/swissmedic/en/dokumente/medizinprodukte/mep_urr/bw630_30_007d_mbmedizinprodukte-software.pdf.download.pdf/BW630_30_007e_MB%20Medical%20Device%20Software.pdf"
  - jurisdiction: European Union
    device_framework:
      name: "Regulation (EU) 2017/745 (MDR)"
      citation: "EU MDR"
      key_references:
        - ref: "Article 2(1) MDR"
          note: "Definition of medical device includes software."
        - ref: "Article 51 MDR + Annex VIII"
          note: "Risk-classification framework; software classification rules applied through Annex VIII (including Rule 11)."
        - ref: "MDCG 2019-11 Rev.1 (June 2025)"
          note: "Qualification and classification guidance for software under MDR/IVDR."
        - ref: "Regulation (EU) 2024/1689 (EU AI Act)"
          note: "Provider quality management system (Art. 17), risk management (Art. 9), post-market monitoring (Art. 72), serious incident reporting (Art. 73), technical documentation (Annex IV), and conformity assessment (Annexes VI/VII) apply to high-risk AI systems (Art. 6(1)/(2) + Annex I/III)."
        - ref: "Commission Implementing Decision (EU) 2026/2274 (12 Oct 2026)"
          note: "Cites EN 18286:2026 (AI QMS) and provides presumption of conformity with Reg. (EU) 2024/1689 Art. 17(1)(a)-(m)."
      source_links:
        - "https://eur-lex.europa.eu/eli/reg/2017/745/2025-01-10/eng"
        - "https://health.ec.europa.eu/latest-updates/update-mdcg-2019-11-rev1-qualification-and-classification-software-regulation-eu-2017745-and-2025-06-17_en"
  - jurisdiction: United States
    device_framework:
      name: "Federal Food, Drug, and Cosmetic Act + FDA device software policy"
      citation: "21 U.S.C. and FDA guidance"
      key_references:
        - ref: "FD&C Act section 201(h) (21 U.S.C. 321(h))"
          note: "Device definition baseline for software functions."
        - ref: "FD&C Act section 520(o) (21 U.S.C. 360j(o))"
          note: "Software functions excluded from device definition."
        - ref: "FDA Guidance: Policy for Device Software Functions and Mobile Medical Applications (September 2022)"
          note: "Risk-based FDA oversight for device software functions."
        - ref: "FDA Guidance: Content of Premarket Submissions for Device Software Functions (June 2023)"
          note: "Premarket documentation expectations for device software functions."
        - ref: "21 CFR Part 820 (QMSR, effective February 2, 2026)"
          note: "QMS obligations for finished device manufacturers."
      source_links:
        - "https://uscode.house.gov/view.xhtml?req=(title:21%20section:321%20edition:prelim)"
        - "https://uscode.house.gov/view.xhtml?req=(title:21%20section:360j%20edition:prelim)"
        - "https://www.fda.gov/regulatory-information/search-fda-guidance-documents/policy-device-software-functions-and-mobile-medical-applications"
        - "https://www.fda.gov/regulatory-information/search-fda-guidance-documents/content-premarket-submissions-device-software-functions"
        - "https://www.fda.gov/medical-devices/postmarket-requirements-devices/quality-management-system-regulation-qmsr"
classification_and_claims_policy:
  principle: "Regulatory qualification, classification, intended use, and claims are maintained per product dossier and approved before release."

# Framework commitment ledger. Orthogonal to jurisdictions above: records the
# commitment state per regulatory framework so a deferred commitment cannot
# rot silently. States:
#   applied        - operating now, with scope boundary and evidence paths
#   planned        - committed later; trigger + owner + review_by are required
#   not_applicable - determined out of scope; rationale + re-evaluation trigger required
#   unknown        - no determination made yet (the default startups actually live in)
# Overdue "planned" / "unknown" entries fail tools/qms_distribution.py check-commitments.
regulatory_commitments:
  version: 1
  commitment_owner_role: management_representative
  entries:
    - framework: "EN ISO 13485:2016 (+A11:2021)"
      status: applied
      scope_note: "Core QMS spine; all medical-device SOPs applied."
      scope_owner: management_representative
      re_evaluation_trigger: "Change in intended use or scope."
      review_by: "2026-12-31"
    - framework: "ISO/IEC 42001:2023"
      status: applied
      scope_note: "Product-AI AIMS under SOP-022; only when AI components are present in released or candidate products."
      scope_owner: qa_lead
      re_evaluation_trigger: "Introduction or material change of an AI component."
      review_by: "2027-03-31"
    - framework: "EN 18286:2026 (EU AI Act provider QMS)"
      status: planned
      scope_note: "Planned on EU market placement of a high-risk AI system, or reclassification to high-risk under Regulation (EU) 2024/1689 Art. 6(1)/(2) (Annex I/III)."
      trigger: "EU market placement of a high-risk AI system, or high-risk classification under Reg. (EU) 2024/1689."
      scope_owner: management_representative
      re_evaluation_trigger: "Any EU AI system introduced, any product reclassified high-risk, any high-risk AI contract signed."
      review_by: "2027-09-30"
    - framework: "GDPR / Swiss nFADP"
      status: applied
      scope_note: "SOP-023 plus processing activity register; applicable only when personal data is processed."
      scope_owner: privacy_lead
      re_evaluation_trigger: "New processing activity or jurisdiction change."
      review_by: "2026-12-31"
  # Controlled documents that are present in this public baseline but not applied
  # by adopting organisations until the matching commitment moves to "applied".
  # Each entry appears here precisely so a published-but-unapplied SOP is not
  # mistaken for a stale or uncontrolled artifact during audit.
  published_not_applied:
    - document: "SOP-024"
      expected_release: "pr2-ai-act-provider-qms"
      rationale: "EN 18286 layer ships with this baseline for adopters to opt into; not activated until a matching commitment is applied."
