notes:
  - "No copyrighted standard text is included; only clause references, high-level control families, and implementation decisions."
  - "AI Act companion standards are not OJ-cited as of 2026-10-27 (public sources list them as under preparation); 18228/18282/18283/18284/18229/24970 statuses are shown as such and they may be replaced by 42001 or 13485 controls in the interim."
