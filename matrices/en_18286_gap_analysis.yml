version: 1
analysis_date: "2026-10-15"
standard:
  exact_name: "EN 18286:2026 Artificial intelligence - Quality management system for EU AI Act regulatory purposes"
  normative_base: "EN 18286:2026"
  normative_source_verified: false
analysis_scope: >
  Provider quality management system for AI systems placed on, or put into service
  in, the European Union under Regulation (EU) 2024/1689. Clause numbering and
  content drawn from the published DIN EN 18286:2026-09 table of contents and the
  October 2025 enquiry-draft analysis; verify against purchased normative text.
analysis_provenance:
  sources:
    - "DIN EN 18286:2026-09 published table of contents"
    - "CMS Law-Now analysis of prEN 18286 (Oct 2025 enquiry draft)"
    - "Commission Implementing Decision (EU) 2026/2274"
  notes:
    - "Clauses 8-10 were renumbered between the enquiry draft and the published edition."
    - "Annex D maps to EN ISO/IEC 42001:2026; this baseline tracks ISO/IEC 42001:2023. No full correspondence is claimed."
outstanding_gaps:
  - "Normative clause content verification pending purchase of the standard."
  - "AI Act companion standards (18228, 18282, 18283, 18284, 18229 Parts 1 and 2, 24970) are not OJ-cited."
  - "Annex ZA crosswalk (EN 18286 clause to Art. 17(1) element) waits for verification against the purchased normative text."
