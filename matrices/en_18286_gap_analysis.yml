  "5": ["QM-001", "SOP-005", "SOP-024"]
  "6": ["SOP-024", "SOP-016", "SOP-018", "SOP-022"]
  "7": ["SOP-001", "SOP-011", "SOP-024"]
  "8": ["SOP-007", "SOP-008", "SOP-018", "SOP-019", "SOP-020", "SOP-022", "SOP-024", "WI-001", "WI-002"]
